# Arrivio Spring Boot Configuration
# Load backend/.env when running from the backend directory; real environment variables override file values.
spring.config.import=optional:file:./.env[.properties]

# Groq AI configuration (API key is supplied through the environment or ignored .env file)
arrivio.ai.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

server.port=${PORT:8080}

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:arriviodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# create-drop: recreate schema on each boot (safe for in-memory H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Suppress open-in-view warning (not needed for REST API)
spring.jpa.open-in-view=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.arrivio=INFO

